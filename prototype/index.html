<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Hermes</title>
    <script>
      // Apply theme before the first paint, independently of React effects.
      (() => {
        let mode = 'system';
        try { mode = localStorage.getItem('hermes-ui-theme') || mode; } catch {}
        const query = new URLSearchParams(location.search).get('theme');
        if (['light', 'dark', 'system'].includes(query)) mode = query;
        try { document.documentElement.dataset.accent = localStorage.getItem('hermes-ui-accent') || 'blue'; } catch {}
        document.documentElement.dataset.theme = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
